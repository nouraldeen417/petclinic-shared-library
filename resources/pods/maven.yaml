apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-deployer
  containers:    
    - name: maven
      image: maven:3.9-eclipse-temurin-17
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"